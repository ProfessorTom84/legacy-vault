# Deploy from pre-built images on GitHub Container Registry — no local build.
# Set GITHUB_REPO in .env (e.g. GITHUB_REPO=yourname/legacy-vault), then:
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# To update after pushing changes to GitHub:
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  backend:
    image: ghcr.io/${GITHUB_REPO:?set GITHUB_REPO in .env}-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    volumes:
      - vault_db:/data/db
      - vault_media:/data/uploads
    expose:
      - "4000"

  frontend:
    image: ghcr.io/${GITHUB_REPO:?set GITHUB_REPO in .env}-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  vault_db:
  vault_media:
