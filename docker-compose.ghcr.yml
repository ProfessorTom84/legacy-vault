# Deploy from the pre-built image on GitHub Container Registry — no local
# build. Set GITHUB_REPO in .env (e.g. GITHUB_REPO=yourname/legacy-vault):
#
#   docker compose -f docker-compose.ghcr.yml up -d
#
# To update after pushing changes to GitHub:
#
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d

services:
  vault:
    image: ghcr.io/${GITHUB_REPO:?set GITHUB_REPO in .env}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    ports:
      - "${PORT:-8080}:4000"
    volumes:
      - vault_db:/data/db
      - vault_media:/data/uploads

volumes:
  vault_db:
  vault_media:
