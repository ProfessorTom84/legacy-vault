# Single-container deployment: one service runs the API, serves the built
# React app, and streams authenticated media. Build locally with:
#
#   cp .env.example .env   # set JWT_SECRET at minimum
#   docker compose up -d --build

services:
  vault:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
    ports:
      - "${PORT:-8080}:4000"
    volumes:
      - vault_db:/data/db
      - vault_media:/data/uploads
      - vault_logs:/data/logs

volumes:
  vault_db:
  vault_media:
  vault_logs:
